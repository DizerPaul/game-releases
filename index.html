<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game — лаунчер</title>
<style>
  :root { --bg:#0E0F10; --panel:#17191B; --border:#2A2D30; --text:#E6E2DA; --muted:#9A968F; --accent:#D9622B; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
         font-family: Bahnschrift, "Segoe UI", system-ui, sans-serif; display:flex; align-items:center; justify-content:center; padding:16px;
         background-image: linear-gradient(#ffffff0b 1px, transparent 1px), linear-gradient(90deg, #ffffff0b 1px, transparent 1px);
         background-size: 48px 48px; }
  main { max-width:560px; width:100%; }
  h1 { font-size:clamp(64px, 18vw, 112px); line-height:.9; margin:0; font-weight:700; font-stretch:condensed; letter-spacing:-1px; }
  .bar { width:140px; height:8px; background:var(--accent); margin:14px 0 24px; clip-path: polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px); }
  p { color:var(--muted); font-family:"Segoe UI", system-ui, sans-serif; line-height:1.55; }
  .tagline { color:var(--text); font-size:22px; font-weight:600; margin:0 0 8px; font-family: inherit; }
  a.button { display:inline-block; margin-top:20px; padding:16px 32px; background:var(--accent); color:#170B05; text-decoration:none;
             font-weight:700; font-size:22px; clip-path: polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px); }
  a.button:hover { background:#EF7738; }
  a.link { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>GAME</h1>
  <div class="bar"></div>
  <p class="tagline">Выживи. Собери. Эвакуируйся.</p>
  <p>Здесь будет ссылка на установщик лаунчера. Новости и анонсы — в нашем Telegram-канале.</p>
  <a class="button" href="https://t.me/paulDizerGames">Telegram-канал</a>
</main>
</body>
</html>
